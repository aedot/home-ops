---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-db
  annotations:
    # Required for same-path/same-serverName rebuilds via bootstrap.recovery.
    # The default check blocks recovery when the destination archive is non-empty,
    # which is exactly the case when the rebuilt cluster reuses the same Barman
    # path. Safe here because the recovered cluster inherits the source's
    # system_identifier and writes new WAL on a new timeline (no name collisions).
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:b54426c7d1e45e9055c6b019a77b203fcecf8d3a39bf55ae4f40dc6b851a90bc
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true
  # minSyncReplicas: 1
  # maxSyncReplicas: 1
  storage:
    storageClass: longhorn
    size: 5Gi
  postgresql:
    parameters:
      max_connections: "200"
      max_wal_size: "256MB"
      shared_buffers: "128MB"
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cloudflare-r2
        serverName: ${APP}
  bootstrap:
    recovery:
      source: &archive ${APP}-backup-archive
      database: ${APP}
      owner: ${APP}
  # Recovery source for bootstrap.recovery: resolve ${APP}-backup-archive via the
  # barman-cloud CNPG-i plugin against the cloudflare-r2 ObjectStore. serverName
  # must match the name the source archived under (same-name rebuild => ${APP}).
  externalClusters:
    - name: *archive
      plugin:
        name: *plugin
        parameters:
          barmanObjectName: cloudflare-r2
          serverName: ${APP}
