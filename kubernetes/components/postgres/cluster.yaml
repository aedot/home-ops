---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-db
  annotations:
    # Required for same-path/same-serverName rebuilds via bootstrap.recovery.
    # The default check blocks recovery when the destination archive is non-empty,
    # which is exactly the case when the rebuilt cluster reuses the same Barman
    # path. Safe here because the recovered cluster inherits the source's
    # system_identifier and writes new WAL on a new timeline (no name collisions).
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: ${PG_INSTANCES:=3}
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:e689407a7a51bdf26ff3166d6ebbe134bdeff00ac10f36edc9fc49d49a8ee3f5
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: ${PG_SUPERUSER:=false}
  affinity:
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 100m
      memory: ${PG_MEMORY_REQUEST:=512Mi}
    limits:
      memory: ${PG_MEMORY_LIMIT:=1Gi}
  storage:
    storageClass: ${PG_STORAGE_CLASS:=longhorn-postgres}
    size: ${PG_STORAGE_SIZE:=5Gi}
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    parameters:
      max_connections: "200"
      max_wal_size: "256MB"
      shared_buffers: "128MB"
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cloudflare-r2
        serverName: ${APP}
  bootstrap:
    recovery:
      source: &archive ${APP}-backup-archive
      database: ${APP}
      owner: ${APP}
  # Recovery source for bootstrap.recovery: resolve ${APP}-backup-archive via the
  # barman-cloud CNPG-i plugin against the cloudflare-r2 ObjectStore. serverName
  # must match the name the source archived under (same-name rebuild => ${APP}).
  externalClusters:
    - name: *archive
      plugin:
        name: *plugin
        parameters:
          barmanObjectName: cloudflare-r2
          serverName: ${APP}
