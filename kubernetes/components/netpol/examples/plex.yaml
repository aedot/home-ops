---
# NOT attached anywhere. Needed before the baseline is applied to `media`:
# Plex is a LoadBalancer service (172.24.30.81) reached from the LAN and from
# the internet through a port forward, and both arrive as `world`.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex-world
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plex
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
