---
# NOT attached anywhere. Needed before a baseline is applied to `dbms`:
# Mosquitto is a LoadBalancer service (172.24.30.92) used by LAN devices, and
# in-cluster by Home Assistant and Zigbee2MQTT in home-automation.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosquitto-clients
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home-automation
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
