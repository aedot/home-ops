---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  mover:
    podSecurityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 3
    keepHourly: 6
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  suspend: true
  verification:
    deep:
      schedule:
        cron: H 5 1 * * # First of the month at 5am
    quick:
      schedule:
        cron: H 3 * * * # Every day at 3am
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=longhorn-snapclass}
