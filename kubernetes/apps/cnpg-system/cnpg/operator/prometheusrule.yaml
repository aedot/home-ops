# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-pg
spec:
  groups:
    - name: cnpg-pg.rules
      rules:
        - alert: LongRunningTransaction
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 5m
          annotations:
            summary: >
              Pod {{ $labels.pod }} is taking more than {{ $value }} seconds for a query.
          labels:
            severity: critical

        - alert: BackendsWaiting
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 5m
          annotations:
            summary: >
              Pod {{ $labels.pod }} has been waiting for longer than {{ $value }} seconds
          labels:
            severity: critical

        - alert: PGDatabase
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 5m
          annotations:
            summary: >
              Over {{ $value }} transactions from frozen xid on pod {{ $labels.pod }}
          labels:
            severity: critical

        - alert: PGReplication
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 5m
          annotations:
            summary: >
              Standby is lagging behind by over {{ $value }} seconds
          labels:
            severity: critical

        - alert: LastFailedArchiveTime
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 5m
          annotations:
            summary: >
              Archiving failed for {{ $labels.pod }}
          labels:
            severity: critical

        - alert: DatabaseDeadlockConflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 5m
          annotations:
            summary: >
              There are over {{ $value }} deadlock conflicts in {{ $labels.pod }}
          labels:
            severity: critical

        - alert: ReplicaFailingReplication
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 5m
          annotations:
            summary: >
              Replica {{ $labels.pod }} is failing to replicate
          labels:
            severity: critical

        - alert: CNPGBackupStale
          expr: |-
            time() - max by (exported_namespace, cluster) (cnpg_backup_stopped_timestamp_seconds{phase="completed"}) > 129600
          for: 15m
          annotations:
            summary: >
              No successful backup for cluster {{ $labels.cluster }} in over 36 hours
          labels:
            severity: critical

        - alert: CNPGBackupFailed
          expr: |-
            time() - max by (exported_namespace, cluster) (cnpg_backup_stopped_timestamp_seconds{phase="failed"}) < 86400
          annotations:
            summary: >
              A backup for cluster {{ $labels.cluster }} failed in the last 24 hours
          labels:
            severity: critical

        - alert: CNPGInstanceDown
          expr: |-
            cnpg_collector_up == 0
          for: 5m
          annotations:
            summary: >
              PostgreSQL is not running on pod {{ $labels.pod }}
          labels:
            severity: critical

        - alert: CNPGReplicasMissing
          expr: |-
            (cnpg_pg_replication_streaming_replicas < 2)
            and on (namespace, pod) (cnpg_pg_replication_in_recovery == 0)
          for: 10m
          annotations:
            summary: >
              Primary {{ $labels.pod }} has only {{ $value }} streaming replicas
          labels:
            severity: warning

        - alert: CNPGLowDiskSpace
          expr: |-
            kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".+-db-[0-9]+"}
              / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+-db-[0-9]+"} < 0.15
          for: 10m
          annotations:
            summary: >
              Volume {{ $labels.persistentvolumeclaim }} has less than 15% free space
          labels:
            severity: critical
