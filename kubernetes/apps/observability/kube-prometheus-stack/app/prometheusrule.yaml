---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-prometheus-stack-additional
spec:
  groups:
    - name: offsite-backup.rules
      rules:
        # rclone_r2_last_success_timestamp_seconds is written by the rclone User Script
        # on the NAS (node-exporter textfile collector), see docs/notes/rclone.md.
        - alert: OffsiteBackupStale
          expr: |-
            time() - rclone_r2_last_success_timestamp_seconds > 36 * 3600
          for: 15m
          annotations:
            summary: >-
              The last successful rclone upload of the Kopia repository to R2 was more than 36 hours ago.
          labels:
            severity: critical

        - alert: OffsiteBackupMetricMissing
          expr: |-
            absent(rclone_r2_last_success_timestamp_seconds)
          for: 12h
          annotations:
            summary: >-
              No rclone_r2_last_success_timestamp_seconds metric from the NAS for 12 hours. The User Script has not
              written its heartbeat file, or the node-exporter textfile directory is not being read.
          labels:
            severity: warning

    - name: cert-manager.rules
      rules:
        # Certificates here are short-lived (Let's Encrypt `shortlived` profile, 7d internal
        # certs), so alert on missed renewals and imminent expiry, not on a fixed lead time.
        - alert: CertificateRenewalOverdue
          expr: |-
            time() - certmanager_certificate_renewal_timestamp_seconds > 6 * 3600
          for: 15m
          annotations:
            summary: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} is more than 6 hours past its renewal time. cert-manager is failing to renew it.
          labels:
            severity: critical

        - alert: CertificateExpiringSoon
          expr: |-
            certmanager_certificate_expiration_timestamp_seconds - time() < 12 * 3600
          for: 15m
          annotations:
            summary: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 12 hours.
          labels:
            severity: critical

        - alert: CertificateNotReady
          expr: |-
            max by (namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
          for: 30m
          annotations:
            summary: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 30 minutes.
          labels:
            severity: critical

    - name: dockerhub.rules
      rules:
        - alert: DockerhubRateLimitRisk
          expr: |-
            count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          annotations:
            summary: >-
              There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
          labels:
            severity: critical

    - name: oom.rules
      rules:
        - alert: OomKilled
          expr: |-
            (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          annotations:
            summary: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          labels:
            severity: critical

    - name: zfs.rules
      rules:
        - alert: ZfsUnexpectedPoolState
          expr: |-
            node_zfs_zpool_state{state!="online"} > 0
          annotations:
            summary: >-
              ZFS pool {{ $labels.zpool }} is {{ $labels.state }} on instance {{ $labels.instance }}
          labels:
            severity: critical
