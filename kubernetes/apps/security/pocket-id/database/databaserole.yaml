---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pocket-id
spec:
  cluster:
    name: postgres
  name: pocket_id
  ensure: present
  login: true
  inherit: true
  connectionLimit: 20
  passwordSecret:
    name: postgres-pocket-id-secret
  databaseRoleReclaimPolicy: retain
