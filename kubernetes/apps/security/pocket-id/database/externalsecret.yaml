# The template emits only the role's username and password, so the rest of the pocket-id
# item (ENCRYPTION_KEY, SMTP) never lands in a dbms Secret.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: postgres-pocket-id-secret
    template:
      data:
        username: pocket_id
        password: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: pocket-id
