---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teslamate
spec:
  interval: 30m
  path: ./kubernetes/apps/selfhosted/teslamate/app
  components:
    - ../../../../components/postgres
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: bitwarden-stores
      namespace: external-secrets
    - name: cnpg-barman-cloud
      namespace: cnpg-system
    - name: teslamate-postgres
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
  postBuild:
    substitute:
      APP: teslamate
      PG_BACKUP_MINUTE: "20"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
---
# CNPG resources must live in the cluster's namespace, so this one deploys into dbms.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teslamate-postgres
spec:
  interval: 30m
  path: ./kubernetes/apps/selfhosted/teslamate/database
  dependsOn:
    - name: postgres
      namespace: dbms
    - name: bitwarden-stores
      namespace: external-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dbms
  wait: false
