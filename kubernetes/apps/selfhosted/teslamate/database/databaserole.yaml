---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: teslamate
spec:
  cluster:
    name: postgres
  name: teslamate
  ensure: present
  login: true
  inherit: true
  connectionLimit: 40
  passwordSecret:
    name: postgres-teslamate-secret
  databaseRoleReclaimPolicy: retain
