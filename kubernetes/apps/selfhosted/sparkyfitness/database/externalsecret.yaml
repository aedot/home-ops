# The templates emit only each role's username and password, so the rest of the sparkyfitness
# item never lands in a dbms Secret.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-sparkyfitness-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: postgres-sparkyfitness-admin-secret
    template:
      data:
        username: sparkyfitness_admin
        password: "{{ .POSTGRES_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: sparkyfitness
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-sparkyfitness-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: postgres-sparkyfitness-app-secret
    template:
      data:
        username: sparkyfitness_app
        password: "{{ .POSTGRES_APP_PASSWORD }}"
  dataFrom:
    - extract:
        key: sparkyfitness
