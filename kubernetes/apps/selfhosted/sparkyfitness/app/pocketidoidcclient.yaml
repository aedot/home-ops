---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sparkyfitness
spec:
  name: SparkyFitness
  callbackUrls:
    - https://fitness.${SECRET_DOMAIN}/api/auth/sso/callback/pocket-id
  logo:
    autoGenerate: false
  allowedUserGroups:
    - { name: sso-admin, namespace: security }
    - { name: sso-dev, namespace: security }
    - { name: sso-family, namespace: security }
