---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: sparkyfitness-secret
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        # Shared postgres cluster: the admin role owns the database, the app role is the runtime role
        SPARKY_FITNESS_DB_HOST: postgres-rw.dbms.svc.cluster.local
        SPARKY_FITNESS_DB_PORT: "5432"
        SPARKY_FITNESS_DB_NAME: sparkyfitness
        SPARKY_FITNESS_DB_USER: sparkyfitness_admin
        SPARKY_FITNESS_DB_PASSWORD: "{{ .POSTGRES_ADMIN_PASSWORD }}"
        SPARKY_FITNESS_APP_DB_USER: sparkyfitness_app
        SPARKY_FITNESS_APP_DB_PASSWORD: "{{ .POSTGRES_APP_PASSWORD }}"
        # API / AUTH
        SPARKY_FITNESS_API_ENCRYPTION_KEY: "{{ .SPARKY_FITNESS_API_ENCRYPTION_KEY }}"
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
  dataFrom:
    - extract:
        key: sparkyfitness

