---
# The server opens the connection to the shared Postgres cluster (dbms). With the ingress
# baseline in place, Postgres' replies arrive as new ingress flows from another namespace
# and are denied, same as CoreDNS replies, so allow them by identity.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sparkyfitness-postgres-replies
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sparkyfitness
      app.kubernetes.io/controller: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dbms
            cnpg.io/cluster: postgres
