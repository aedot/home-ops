---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sparkyfitness
spec:
  chartRef:
    kind: OCIRepository
    name: sparkyfitness
  interval: 30m
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/codewithcj/sparkyfitness-server
              tag: v1.12.0@sha256:926f986286ffdfe27fa5ce7a0c20cdb7ec753fa5af782d89bda40b1b416551b5
            env:
              TZ: "America/Los_Angeles"
              SPARKY_FITNESS_EMAIL_HOST: smtp-relay.network.svc.cluster.local
              SPARKY_FITNESS_EMAIL_PORT: 2525
              SPARKY_FITNESS_EMAIL_SECURE: false
              SPARKY_FITNESS_EMAIL_FROM: "Sparky Fitness <noreply@${SECRET_DOMAIN}>"
              SPARKY_FITNESS_DISABLE_EMAIL_LOGIN: true
              SPARKY_FITNESS_DISABLE_PASSKEY_LOGIN: true
              SPARKY_FITNESS_DISABLE_SIGNUP: true
              SPARKY_FITNESS_OIDC_AUTH_ENABLED: "true"
              SPARKY_FITNESS_OIDC_PROVIDER_NAME: XTM ID
              SPARKY_FITNESS_OIDC_PROVIDER_SLUG: pocket-id
              SPARKY_FITNESS_OIDC_ISSUER_URL: https://sso.${SECRET_DOMAIN}
              SPARKY_FITNESS_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-oidc-credentials
                    key: client_id
              SPARKY_FITNESS_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-oidc-credentials
                    key: client_secret
              ALLOW_PRIVATE_NETWORK_CORS: true
              NODE_ENV: "production"
              SERVER_UPLOADS_PATH: /uploads
              SPARKY_FITNESS_FRONTEND_URL: fitness.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/codewithcj/sparkyfitness-frontend
              tag: v1.12.0@sha256:3419ebaf4ba8340b99b3637899f330375743ae1758b80808e9a364e8185ed617
            env:
              PROMETHEUS_ENABLED: "true"
              SPARKY_FITNESS_LOG_LEVEL: debug
              SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server.selfhosted.svc.cluster.local
              SPARKY_FITNESS_SERVER_PORT: 3010
              SPARKY_FITNESS_FRONTEND_URL: fitness.${SECRET_DOMAIN}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: 3010
      frontend:
        controller: frontend
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - fitness.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: frontend
                port: http
    persistence:
      uploads:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          server:
            app:
              - path: /app/SparkyFitnessServer/uploads
