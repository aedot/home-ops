---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sparkyfitness
spec:
  chartRef:
    kind: OCIRepository
    name: sparkyfitness
  interval: 30m
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/codewithcj/sparkyfitness-server
              tag: v1.11.0@sha256:51a2d7c19bd99b50ea17e579fe8d9d4febed895595356b1ddafe0fa808caf75e
            env:
              TZ: "America/Los_Angeles"
              SPARKY_FITNESS_EMAIL_SECURE: false
              SPARKY_FITNESS_FORCE_EMAIL_LOGIN: true
              SPARKY_FITNESS_DISABLE_SIGNUP: true
              ALLOW_PRIVATE_NETWORK_CORS: true
              NODE_ENV: "production"
              SERVER_UPLOADS_PATH: /uploads
              SPARKY_FITNESS_FRONTEND_URL: fitness.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/codewithcj/sparkyfitness-frontend
              tag: v1.11.0@sha256:5eb77135ccd8e58492ee9bd19b8714ea4a73a99623b863a9287ccecb0557cd17
            env:
              PROMETHEUS_ENABLED: "true"
              SPARKY_FITNESS_LOG_LEVEL: debug
              SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server.selfhosted.svc.cluster.local
              SPARKY_FITNESS_SERVER_PORT: 3010
              SPARKY_FITNESS_FRONTEND_URL: fitness.${SECRET_DOMAIN}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      server:
        controller: server
        ports:
          http:
            port: 3010
      frontend:
        controller: frontend
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - fitness.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: frontend
                port: http
    persistence:
      uploads:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          server:
            app:
              - path: /app/SparkyFitnessServer/uploads
