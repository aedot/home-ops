---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sparkyfitness
spec:
  interval: 30m
  path: ./kubernetes/apps/selfhosted/sparkyfitness/app
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: longhorn
      namespace: longhorn-system
    - name: cnpg-barman-cloud
      namespace: cnpg-system
    - name: bitwarden-stores
      namespace: external-secrets
  components:
    - ../../../../components/kopiur
    - ../../../../components/postgres
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  patches:
    # The app runs migrations as the superuser, so new tables are owned by postgres and
    # the app role cannot dump them (permission denied, RLS).
    - target:
        kind: CronJob
      patch: |
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: ${APP}-postgres-backup
        spec:
          jobTemplate:
            spec:
              template:
                spec:
                  containers:
                    - name: ${APP}-postgres-backup
                      env:
                        - name: POSTGRES_USER
                          valueFrom:
                            secretKeyRef:
                              name: ${APP}-db-superuser
                              key: username
                        - name: POSTGRES_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: ${APP}-db-superuser
                              key: password
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: sparkyfitness
      PG_BACKUP_MINUTE: "10"
      PG_SUPERUSER: "true"
