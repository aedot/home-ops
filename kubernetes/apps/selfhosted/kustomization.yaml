---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted

components:
  - ../../components/sops
  - ../../components/namespace
  - ../../components/netpol

resources:
  - ./actual/ks.yaml
  - ./atuin/ks.yaml
  - ./bambuddy/ks.yaml
  - ./grampsweb/ks.yaml
  - ./lubelog/ks.yaml
  - ./sparkyfitness/ks.yaml
  - ./teslamate/ks.yaml
patches:
  # Trial: the allow-all egress policy from the netpol component did not fix the
  # reply drops it was added for (see docs/network-policy.md); selfhosted runs without it.
  - patch: |-
      $patch: delete
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: egress-allow-all
