# The template emits only the role's username and password, so the rest of the grampsweb
# item never lands in a dbms Secret.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-grampsweb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: postgres-grampsweb-secret
    template:
      data:
        username: grampsweb
        password: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: grampsweb
