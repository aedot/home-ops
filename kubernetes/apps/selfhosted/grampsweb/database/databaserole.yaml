---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: grampsweb
spec:
  cluster:
    name: postgres
  name: grampsweb
  ensure: present
  login: true
  inherit: true
  connectionLimit: 30
  passwordSecret:
    name: postgres-grampsweb-secret
  databaseRoleReclaimPolicy: retain
