---
# Match client pods by namespace and app.kubernetes.io/name, not by namespace alone.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-lubelog
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: lubelog
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
