---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: lubelog
spec:
  name: LubeLogger
  callbackUrls:
    - https://lubelog.${SECRET_DOMAIN}/Login/RemoteAuth
  logo:
    autoGenerate: false
  allowedUserGroups:
    - { name: sso-admin, namespace: security }
    - { name: sso-dev, namespace: security }
