# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lubelog
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: lubelog-secret
    template:
      data:
        # Postgres
        POSTGRES_CONNECTION: "Host=postgres-rw.dbms.svc.cluster.local;port=5432;Username=lubelog;Password={{ .POSTGRES_PASSWORD }};Database=lubelog"
        # Smtp
        MailConfig__EmailServer: "{{ .SMTP_HOST }}"
        MailConfig__EmailFrom: "{{ .SMTP_FROM }}"
        MailConfig__Port: "{{ .SMTP_PORT }}"
        MailConfig__Username: "{{ .SMTP_USERNAME }}"
        MailConfig__Password: "{{ .SMTP_PASSWORD }}"
        # Oidc
        OpenIDConfig__Name: XTM-ID
        OpenIDConfig__ClientId: "{{ .LUBELOG_CLIENT_ID }}"
        OpenIDConfig__ClientSecret: "{{ .LUBELOG_CLIENT_SECRET }}"
        OpenIDConfig__AuthURL: https://sso.${SECRET_DOMAIN}/authorize
        OpenIDConfig__TokenURL: https://sso.${SECRET_DOMAIN}/api/oidc/token
        OpenIDConfig__RedirectURL: https://lubelog.${SECRET_DOMAIN}/Login/RemoteAuth
        OpenIDConfig__UserInfoURL: https://sso.${SECRET_DOMAIN}/api/oidc/userinfo
        OpenIDConfig__LogOutURL: https://sso.${SECRET_DOMAIN}/api/oidc/end-session
  dataFrom:
    - extract:
        key: lubelog
    - extract:
        key: smtp
