# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lubelog
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: lubelog-secret
    template:
      data:
        # Postgres
        POSTGRES_CONNECTION: "Host=postgres-rw.dbms.svc.cluster.local;port=5432;Username=lubelog;Password={{ .POSTGRES_PASSWORD }};Database=lubelog"
  dataFrom:
    - extract:
        key: lubelog
