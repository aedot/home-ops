---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lubelog
spec:
  chartRef:
    kind: OCIRepository
    name: lubelog
  interval: 30m
  values:
    controllers:
      lubelog:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hargata/lubelogger
              tag: v1.7.4@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2
            env:
              TZ: America/Los_Angeles
              LC_ALL: en_US.UTF-8
              MailConfig__EmailServer: smtp-relay.network.svc.cluster.local
              MailConfig__EmailFrom: "LubeLog <noreply@${SECRET_DOMAIN}>"
              MailConfig__Port: 2525
              OpenIDConfig__Name: XTM ID
              OpenIDConfig__ClientId:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-oidc-credentials
                    key: client_id
              OpenIDConfig__ClientSecret:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-oidc-credentials
                    key: client_secret
              OpenIDConfig__AuthURL:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-oidc-credentials
                    key: authorization_url
              OpenIDConfig__TokenURL:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-oidc-credentials
                    key: token_url
              OpenIDConfig__UserInfoURL:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-oidc-credentials
                    key: userinfo_url
              OpenIDConfig__JwksURL:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-oidc-credentials
                    key: jwks_url
              OpenIDConfig__RedirectURL: https://{{ .Release.Name }}.${SECRET_DOMAIN}/Login/RemoteAuth
              OpenIDConfig__Scope: openid email profile
              OpenIDConfig__ValidateState: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
       securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # runAsNonRoot: true
        # runAsUser: 1000
        # runAsGroup: 1000
        # seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      app:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /App/config
            subPath: config
          - path: /App/data
            subPath: data
          - path: /App/wwwroot/translations
            subPath: translations
          - path: /App/wwwroot/documents
            subPath: documents
          - path: /App/wwwroot/images
            subPath: images
          - path: /App/log
            subPath: log
          - path: /root/.aspnet/DataProtection-Keys
            subPath: keys
      tmp:
        type: emptyDir
        globalMounts:
          - path: /App/wwwroot/temp
