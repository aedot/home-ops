---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lubelog
spec:
  interval: 30m
  path: ./kubernetes/apps/selfhosted/lubelog/app
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: longhorn
      namespace: longhorn-system
    - name: bitwarden-stores
      namespace: external-secrets
    - name: lubelog-postgres
  components:
    - ../../../../components/kopiur
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: lubelog
      KOPIUR_CAPACITY: 1Gi
---
# CNPG resources must live in the cluster's namespace, so this one deploys into dbms.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lubelog-postgres
spec:
  interval: 30m
  path: ./kubernetes/apps/selfhosted/lubelog/database
  dependsOn:
    - name: postgres
      namespace: dbms
    - name: bitwarden-stores
      namespace: external-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dbms
  wait: false
