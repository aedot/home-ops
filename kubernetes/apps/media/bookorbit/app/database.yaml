---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bookorbit
spec:
  name: bookorbit
  owner: bookorbit
  cluster:
    name: bookorbit-db
  extensions:
    - name: uuid-ossp
      ensure: present
    - name: pg_trgm
      ensure: present
    - name: unaccent
      ensure: present
    - name: vector
      ensure: present
