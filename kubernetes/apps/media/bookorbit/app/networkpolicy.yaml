---
# BookOrbit opens the connection to the smtp-relay (network). With the ingress baseline in
# place, the relay's replies arrive as new ingress flows from another namespace and are
# denied, same as CoreDNS replies, so allow them by identity.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookorbit-smtp-relay-replies
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookorbit-prowlarr-replies
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values:
                - downloads
            - key: app.kubernetes.io/name
              operator: In
              values:
                - prowlarr
                - qbittorrent
                - sabnzbd
