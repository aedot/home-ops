---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bookorbit
  values:
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.8.0@sha256:d318f7732f6f6330312e2c5f854f7899f858b54cc4b18a13cde1f43b5bea0515
            env:
              TZ: America/Los_Angeles
              NODE_ENV: production
              LOG_LEVEL: debug
              PORT: &port 3000
              APP_URL: https://bookorbit.${SECRET_DOMAIN}
              # sso resolves to the internal gateway address, which production mode otherwise rejects
              OIDC_ALLOW_LOCAL_ISSUERS: "true"
              DISABLE_LOCAL_AUTH: true
              BOOKORBIT_FIX_PERMISSIONS: "false"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-db-app"
                    key: fqdn-uri
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      books:
        type: nfs
        server: yemoja.internal
        path: /mnt/alaafin/data
        globalMounts:
          - path: /books
            subPath: media/books
      audiobooks:
        type: nfs
        server: yemoja.internal
        path: /mnt/alaafin/data
        globalMounts:
          - path: /audiobooks
            subPath: media/audiobooks
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
