---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: tracearr
spec:
  name: Tracearr
  # Tracearr sends the oauth2 path as redirect_uri and forwards it to the /callback/oidc handler.
  callbackUrls:
    - https://tracearr.${SECRET_DOMAIN}/api/v1/auth/oauth2/callback/oidc
    - https://tracearr.${SECRET_DOMAIN}/api/v1/auth/callback/oidc
  logo:
    autoGenerate: false
  allowedUserGroups:
    - { name: sso-dev, namespace: security }
