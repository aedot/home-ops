---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./database.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: add
        path: /spec/postgresql/shared_preload_libraries
        value: [timescaledb]
      - op: add
        path: /spec/postgresql/parameters/timescaledb.license
        value: timescale
      - op: add
        path: /spec/postgresql/parameters/timescaledb.telemetry_level
        value: "off"
      - op: add
        path: /spec/postgresql/extensions
        value:
          - name: timescaledb
            image:
              reference: ghcr.io/inomotech-foss/timescaledb-cnpg:2.32.0-pg18@sha256:a06496be4b57ad4f8a4e9e03526cd0570669fc8e9a956461fadc1d07234c7329
