---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plex
spec:
  interval: 30m
  path: ./kubernetes/apps/media/plex/app
  components:
    - ../../../../components/gpu
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: intel-gpu-resource-driver
      namespace: kube-system
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        - op: add
          path: /spec/files
          value:
            ignoreRules:
              - /lost+found
              - /Library/Application Support/Plex Media Server/Cache
              - /Library/Application Support/Plex Media Server/Logs
              - /Library/Application Support/Plex Media Server/Crash Reports
              - /Library/Application Support/Plex Media Server/Updates
              - /Library/Application Support/Plex Media Server/Codecs
              - /Library/Application Support/Plex Media Server/Drivers
              - /Library/Application Support/Plex Media Server/Plug-in Support/Databases/*.db-20*
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: plex
      KOPIUR_CAPACITY: 50Gi

