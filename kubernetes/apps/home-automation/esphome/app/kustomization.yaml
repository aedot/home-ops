---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      - op: add
        path: /spec/files
        value:
          ignoreRules:
            - /lost+found
            - /.cache
