---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: recyclarr
  values:
    apiKey:
      existingSecret: recyclarr-secret
      existingSecretKey: RECYCLARR_API_KEY
    configs:
      existingConfigMap: recyclarr-configmap
    envFrom:
      - secretRef:
          name: recyclarr-secret
    persistence:
      state:
        storageClass: longhorn
    deploymentAnnotations:
      secret.reloader.stakater.com/auto: "true"
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
