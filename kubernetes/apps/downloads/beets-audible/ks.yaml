---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beets-audible
spec:
  interval: 1h
  path: ./kubernetes/apps/downloads/beets-audible/app
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: longhorn
      namespace: longhorn-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: beets-audible
      KOPIUR_CAPACITY: 1Gi
