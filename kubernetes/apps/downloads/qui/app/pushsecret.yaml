---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: qui-oidc
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: qui-oidc-credentials
  data:
    - match:
        secretKey: client_id
        remoteRef:
          remoteKey: qui-oidc-client-id
    - match:
        secretKey: client_secret
        remoteRef:
          remoteKey: qui-oidc-client-secret
