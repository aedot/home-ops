---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f69e4b3b56f3dc18f8004a9f55dcdc372f27eba93563e3180f803f8afaa3f332
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  affinity:
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      memory: 2Gi
  storage:
    storageClass: longhorn-postgres
    size: 10Gi
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    parameters:
      max_connections: "100"
      max_wal_size: "512MB"
      shared_buffers: "256MB"
    # Allow-list: the first matching rule wins and these run before CNPG's default
    # "host all all all scram-sha-256", so the trailing reject makes that rule unreachable.
    # Each tenant adds "host <database> <role> all scram-sha-256" above the reject.
    pg_hba:
      - host all backup all scram-sha-256
      - host pocket_id pocket_id all scram-sha-256
      - host lubelog lubelog all scram-sha-256
      - host gramps grampsweb all scram-sha-256
      - host grampsweb grampsweb all scram-sha-256
      - host teslamate teslamate all scram-sha-256
      - host sparkyfitness sparkyfitness_admin all scram-sha-256
      - host sparkyfitness sparkyfitness_app all scram-sha-256
      - host all all all reject
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cloudflare-r2
        serverName: postgres
