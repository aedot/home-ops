---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: ha-mcp
  values:
    controllers:
      ha-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 9.0.0@sha256:0298113732140c9d725171dc3f1dc5b6a53b03815482536ee2236e17e8cd1bdd
            command: ["ha-mcp-web"]
            env:
              HOMEASSISTANT_URL: http://home-assistant.home-automation.svc.cluster.local:8123
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                # 256Mi OOMKilled this server 2026-10-02 against a ~400-entity
                # HA instance (steady RSS ~134Mi, but a retrying ha_search
                # error-loop pushed it over). 512Mi gives real burst headroom.
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      app:
        controller: ha-mcp
        ports:
          http:
            port: 8086

    route:
      app:
        hostnames:
          - "ha-mcp.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
