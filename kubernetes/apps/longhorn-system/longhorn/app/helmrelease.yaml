---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 1h
  values:
    preUpgradeChecker:
      jobEnabled: false
      upgradeVersionCheck: false
    persistence:
      defaultDataLocality: best-effort
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"recurring-fs-trim", "isGroup":false}]'
    defaultSettings:
      # V2 (SPDK) data engine only — no v1 disks/StorageClasses. Previously
      # reverted at v1.12.0 for a v2 NVMe-TCP stale-device race that flipped app
      # ext4 read-only; fixed in v1.12.1 (longhorn #13332 + #13482). Each node's
      # whole data disk is a v2 block disk (/dev/disk/by-partlabel/r-longhornv2)
      # — see talconfig.yaml, machine-nodelabel.yaml and longhorn-v2-volume.yaml.
      v2DataEngine: true
      defaultDataEngine: v2
      replicaDiskSoftAntiAffinity: false
      createDefaultDiskLabeledNodes: true
      defaultDataLocality: best-effort
      defaultLonghornStaticStorageClass: longhorn
      defaultReplicaCount: "3"
      guaranteedEngineManagerCPU: "20"
      guaranteedReplicaManagerCPU: "20"
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: replica-data;instance
      # Auto-balance disabled: on a 3-node/3-replica cluster replicas are already
      # fully spread, so rebalancing is pure churn.
      replicaAutoBalance: disabled
      # Parallel rebuilds so recovery after a node reboot isn't serialized to a
      # crawl. Talos upgrades take every replica on a node offline at once; at "1"
      # a rolling upgrade left volumes degraded/at-risk far longer than necessary.
      # "3" trades some disk/network pressure for much faster heal-back.
      concurrentReplicaRebuildPerNodeLimit: "3"
      storageMinimalAvailablePercentage: "1"
      storageReservedPercentageForDefaultDisk: "10"
    ingress:
      enabled: false
    httproute:
      enabled: true
      hostnames:
        - "longhorn.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network
    metrics:
      serviceMonitor:
        enabled: true
