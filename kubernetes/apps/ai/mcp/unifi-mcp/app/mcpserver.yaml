---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.39.0@sha256:559efc53fc77e28566cbabf99ce18091626dd053e7760eb9b8d1ad020bf35410
  telemetryConfigRef:
    name: prometheus
    serviceName: unifi-mcp
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  env:
    - name: UNIFI_NETWORK_HOST
      value: unifi.internal
    - name: UNIFI_NETWORK_SITE
      value: default
    - name: UNIFI_NETWORK_VERIFY_SSL
      value: "false"
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    # The ToolHive proxy connects by service name, which the rebinding check rejects.
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
    - name: UNIFI_TOOL_REGISTRATION_MODE
      value: meta_only
    - name: UNIFI_POLICY_CREATE
      value: "false"
    - name: UNIFI_POLICY_UPDATE
      value: "false"
    - name: UNIFI_POLICY_DELETE
      value: "false"
    - name: UNIFI_TOOL_PERMISSION_MODE
      value: confirm
  secrets:
    - name: unifi-mcp-secret
      key: UNIFI_NETWORK_API_KEY
      targetEnvName: UNIFI_NETWORK_API_KEY
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
