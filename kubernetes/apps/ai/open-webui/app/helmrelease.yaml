---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 30m
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.3@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def
            env:
              TZ: America/Los_Angeles
              PORT: &port 8080
              WEBUI_URL: https://chat.${SECRET_DOMAIN}
              OLLAMA_BASE_URL: http://oshun.internal:11434
              ENABLE_OLLAMA_API: true
              OAUTH_PROVIDER_NAME: XTM ID
              OPENID_PROVIDER_URL: https://sso.${SECRET_DOMAIN}/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.${SECRET_DOMAIN}/oauth/oidc/callback
              ENABLE_OAUTH_SIGNUP: "true"
              # Pocket ID accounts are admin-managed, so its emails are trusted; this links
              # an existing local account to the same email instead of creating a duplicate.
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              # Sync Pocket ID groups into Open WebUI groups on login; tool-server
              # access is then granted to those groups in the admin UI.
              OAUTH_SCOPES: openid email profile groups
              ENABLE_OAUTH_GROUP_MANAGEMENT: "true"
              ENABLE_OAUTH_GROUP_CREATION: "true"
              SCARF_NO_ANALYTICS: "true"
              DO_NOT_TRACK: "true"
              ANONYMIZED_TELEMETRY: "false"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["chat.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          open-webui:
            app:
              - path: /app/backend/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
