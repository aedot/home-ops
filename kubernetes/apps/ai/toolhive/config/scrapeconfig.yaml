---
# The proxy serves /metrics on a diagnostics port (9464) that is not declared as a
# containerPort, so a PodMonitor cannot discover it; scrape by pod IP instead.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: toolhive-mcp-proxy
spec:
  kubernetesSDConfigs:
    - role: Pod
      namespaces:
        names: [ai]
  metricsPath: /metrics
  scrapeInterval: 30s
  relabelings:
    - action: Keep
      sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
      regex: mcpserver
    - action: Replace
      sourceLabels: [__meta_kubernetes_pod_ip]
      targetLabel: __address__
      replacement: $1:9464
    - action: Replace
      sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
      targetLabel: job
