---
cluster:
  allowSchedulingOnControlPlanes: true
  # discovery block dropped: 1.14 defaults already are discovery on, service
  # registry on, kubernetes registry off (talhelper emits DiscoveryServiceConfig
  # + DiscoveryIdentityConfig).
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 172.24.20.0/24
  # KubeCoreDNSConfig isn't registered in talhelper 3.1.17's machinery
  # (v1.14.0-alpha.2); use the legacy inline field to disable Talos-managed CoreDNS.
  coreDNS:
    disabled: true
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: "true"
  feature-gates: HPAScaleToZero=true
---
# Talos 1.14 moved admission control out of cluster.apiServer.admissionControl.
# PodSecurity set to privileged everywhere = no PSA restrictions (Longhorn etc.
# run privileged), replacing the previous "$$patch: delete" of admissionControl.
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  kind: PodSecurityConfiguration
  defaults:
    audit: privileged
    audit-version: latest
    enforce: privileged
    enforce-version: latest
    warn: privileged
    warn-version: latest
  # exemptions inherited from the generated base (kube-system); omitted here to
  # avoid list-merge duplicating the namespace (apiserver rejects duplicates).
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
  feature-gates: HPAScaleToZero=true
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
config:
  apiVersion: kubescheduler.config.k8s.io/v1
  kind: KubeSchedulerConfiguration
  profiles:
    - schedulerName: default-scheduler
      plugins:
        score:
          disabled:
            - name: ImageLocality
      pluginConfig:
        - name: PodTopologySpread
          args:
            defaultingType: List
            defaultConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
---
# Cilium is the kube-proxy replacement.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
